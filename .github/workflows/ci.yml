name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.11
      - name: Install locked dependencies and Ansible collections
        run: make setup
      - name: Validate controller and provisioning
        run: make check
      - name: Validate bootstrap syntax
        run: bash -n bootstrap.sh
      - name: Build downloadable artifacts
        run: uv run python scripts/build_release.py
      - name: Upload verified build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-infra-${{ github.sha }}
          path: |
            dist/homeinfra.pyz
            dist/hello.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
