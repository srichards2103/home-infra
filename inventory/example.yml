---
all:
  children:
    mac_servers:
      hosts:
        mini:
          ansible_host: mini.example.ts.net
          ansible_user: serveradmin
          ansible_python_interpreter: /opt/homebrew/opt/python@3.13/bin/python3.13
          homeinfra_hostname: home-mini
          homeinfra_services:
            - name: hello
              user: hi_hello

